aid: cutiss
name: CUTISS
description: 'CUTISS AG is a Swiss late-stage clinical TechBio company headquartered at the
  Bio-Technopark in Schlieren, Zurich, founded in 2017 as a spin-off of the Tissue Biology Research
  Unit (TBRU) at the University of Zurich and the University Children''s Hospital Zurich, and
  accelerated through Wyss Zurich. Its lead product, denovoSkin, is a first-in-class bioengineered,
  personalized dermo-epidermal skin graft grown from a small biopsy of a patient''s own skin to treat
  large and deep skin defects in children and adults; it holds Orphan Drug Designation for burns from
  Swissmedic, the EMA and the FDA and is in late-stage clinical development. With CSEM the company
  built denovoCast, described as the world''s first machine for automated production of personalized
  human skin tissue, funded in part by Innosuisse and EU Horizon 2020. CUTISS has raised roughly CHF
  50 million and employs around 50 people. It is a therapeutics manufacturer, not a software vendor:
  it publishes no product API, no developer portal, no SDKs and no pricing. The only machine-readable
  API on its public host is the WordPress REST API behind cutiss.swiss, which serves the newsroom,
  blog, corporate pages, team directory, teams taxonomy and media library as JSON, read-only without
  credentials.'
