method: derived
source: openapi/ + live sample responses
note: Entity graph derived from the id-reference fields and _links relations present in real responses.
id_scheme:
  style: integer surrogate keys
  detail: Every object is keyed by a site-scoped integer WordPress id. There are no prefixed or globally
    unique ids; ids collide across types and are only meaningful with the type.
