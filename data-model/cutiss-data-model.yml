relationships:
- from: Post
  to: Category
  type: has_many
  via: categories[] (array of Category ids)
- from: Post
  to: MediaItem
  type: has_one
  via: featured_media (MediaItem id, 0 when unset)
- from: Post
  to: User
  type: belongs_to
  via: author (User id)
  resolvable: false
  note: Target collection is 401-gated.
- from: Page
  to: Page
  type: belongs_to
  via: parent (Page id, 0 at root)
- from: Page
  to: MediaItem
  type: has_one
  via: featured_media
- from: NewsroomItem
  to: MediaItem
  type: has_one
  via: featured_media
- from: TeamMember
  to: TeamTerm
  type: has_many
  via: cutiss-teams[] (array of TeamTerm ids)
- from: TeamMember
  to: MediaItem
  type: has_one
  via: featured_media (the profile portrait)
- from: TeamTerm
  to: TeamTerm
  type: belongs_to
  via: parent
- from: Category
  to: Category
  type: belongs_to
  via: parent
- from: MediaItem
  to: Post
  type: belongs_to
  via: post (id of the object the file is attached to)
- from: SearchResult
  to: Post|Page|NewsroomItem|TeamMember
  type: has_one
  via: id + subtype
traversal:
  detail: Adding _embed to any request inlines featured_media, author and term relations from the _links
    envelope, collapsing the joins above into one call.
language_axis:
  detail: Polylang keeps parallel English and German objects as SEPARATE records with distinct ids. There
    is no language field in the default wp/v2 representation, so counts above include both trees and a
    naive consumer will see each item twice.
